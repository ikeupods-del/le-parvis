<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Parvis — réseau social chrétien</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --ink:#16213E; --muted:#5B6784; --line:#D5DCE8;
  --accent:#2F4BA0; --accent-ink:#FFFFFF; --gold:#B87A12; --sage:#3F6B58; --danger:#A8322D;
  --arch:#2F4BA0; --arch-ink:#F6F2E6; --arch-gold:#F0C768;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101729; --surface:#19223B; --ink:#E9EEFB; --muted:#9AA7C7; --line:#2A3556;
    --accent:#8EA4F0; --accent-ink:#101729; --gold:#E3B04B; --sage:#7FB79D; --danger:#F08A84;
    --arch:#22336F; --arch-ink:#F6F2E6; --arch-gold:#F0C768;
  }
}
:root[data-theme="dark"]{
  --bg:#101729; --surface:#19223B; --ink:#E9EEFB; --muted:#9AA7C7; --line:#2A3556;
  --accent:#8EA4F0; --accent-ink:#101729; --gold:#E3B04B; --sage:#7FB79D; --danger:#F08A84;
  --arch:#22336F; --arch-ink:#F6F2E6; --arch-gold:#F0C768;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:560px;margin:0 auto;padding:16px 16px 96px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:8px 0 16px}
.brand{font-family:var(--serif);font-size:26px;font-weight:500;letter-spacing:-.01em;margin:0}
.brand small{display:block;font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:400;letter-spacing:0}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:44px;height:44px;display:grid;place-items:center;font-size:18px}
h2{font-family:var(--serif);font-weight:500;font-size:24px;margin:24px 0 8px;letter-spacing:-.005em}
h3{font-size:17px;margin:0 0 4px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Verse arch */
.arch{background:var(--arch);color:var(--arch-ink);border-radius:999px 999px 20px 20px;padding:72px 28px 28px;text-align:center;position:relative;margin:4px 0 16px}
.arch::before{content:"";position:absolute;top:22px;left:50%;width:2px;height:30px;background:var(--arch-gold);transform:translateX(-50%);opacity:.9}
.arch::after{content:"";position:absolute;top:34px;left:50%;width:28px;height:2px;background:var(--arch-gold);transform:translateX(-50%);opacity:.9}
.arch .date{font-size:14px;opacity:.8;margin-bottom:12px}
.arch blockquote{font-family:var(--serif);font-size:26px;line-height:1.35;margin:0 0 16px;font-weight:400}
.arch cite{font-style:normal;color:var(--arch-gold);font-weight:600;font-size:16px}
.arch .src{font-size:13px;opacity:.7;margin-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.arch .row{justify-content:center;margin-top:20px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 16px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost-light{background:transparent;color:var(--arch-ink);border-color:rgba(246,242,230,.45)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card.flat{border-radius:10px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:var(--sage);border-radius:99px;transition:width .25s}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font-weight:500;min-height:40px}
.chip[aria-pressed="true"],.chip[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* Reading days */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;min-height:56px;display:flex;flex-direction:column;justify-content:center}
.day b{font-size:13px;color:var(--muted);font-weight:500}
.day span{font-weight:600}
.day[aria-pressed="true"]{background:color-mix(in srgb,var(--sage) 18%,var(--surface));border-color:var(--sage)}
.day[aria-pressed="true"] span::after{content:" ✓";color:var(--sage)}
.day.next{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

/* Forms */
label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
input[type=text],textarea,select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:44px}
textarea{resize:vertical;min-height:90px}
.field{margin-bottom:12px}

/* Prayers */
.prayer{border-left:4px solid var(--accent);border-radius:10px 16px 16px 10px}
.prayer.answered{border-left-color:var(--sage)}
.prayer .meta{font-size:13px;color:var(--muted);margin-bottom:6px}
.prayer .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent);margin-right:6px}
.tag.ok{background:color-mix(in srgb,var(--sage) 18%,var(--surface));color:var(--sage)}

/* Chat */
.demo-note{background:color-mix(in srgb,var(--gold) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 50%,var(--line));border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.msgs{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.msg{max-width:88%;background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 12px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-radius:16px 16px 4px 16px}
.msg .who{font-size:12px;font-weight:700;opacity:.8;margin-bottom:2px}
.msg .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.msg .tools{display:flex;gap:12px;margin-top:6px}
.msg .tools button{border:0;background:none;padding:4px 0;font-size:12px;color:var(--muted);text-decoration:underline;min-height:28px}
.composer{display:flex;gap:8px;position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:8px 0}
.composer input{flex:1}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;border:0;background:none;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;color:var(--muted);min-height:60px}
nav.tabs button span.i{font-size:20px;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}

/* Modal + toast */
.modal-back{position:fixed;inset:0;background:rgba(10,15,30,.55);display:grid;place-items:end center;z-index:30;padding:0}
.modal{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto}
.modal ul{padding-left:20px;margin:8px 0 16px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:90%;text-align:center}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--serif);font-size:20px;font-weight:500;margin-bottom:4px}
a{color:var(--accent)}
/* Partenaires */
.partners-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:24px 0 8px}
.partners-head h2{margin:0}
.partners-head .lbl{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 10px;white-space:nowrap}
.partners{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.partners::-webkit-scrollbar{display:none}
.partner{flex:0 0 78%;max-width:300px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:6px 6px 16px 16px;padding:14px;text-align:left}
.partner .cat{font-size:13px;color:var(--gold);font-weight:600}
.partner h3{font-family:var(--serif);font-weight:500;font-size:19px;margin:2px 0 4px}
.partner p{font-size:14px;color:var(--muted);margin:0}
.partner.cta{border-top-color:var(--accent);display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:#1f1f1f;border:1px solid #c9ced8;border-radius:12px;min-height:48px;font-weight:600}
.gbtn svg{width:20px;height:20px}
/* Réseau social */
.ami{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:0 7px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.sup{display:inline-block;font-size:11px;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:0 7px;margin-left:6px;vertical-align:2px}
.pimg{display:block;max-width:100%;max-height:420px;border-radius:12px;margin:0 0 10px}
.avatar{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;color:#fff;font-weight:700;flex:0 0 auto}
.avatar.lg{width:72px;height:72px;font-size:28px;font-family:var(--serif)}
.post{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.post .ph{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.post .nm{border:0;background:none;padding:0;font-weight:700;text-align:left;color:var(--ink);min-height:0}
.post .nm:disabled{color:var(--ink);opacity:1}
.post .sub{font-size:13px;color:var(--muted);margin-top:2px}
.post .pt{white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 10px}
.post .acts{display:flex;gap:8px;flex-wrap:wrap}
.react{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;min-height:40px;font-weight:600;font-size:14px;color:var(--ink)}
.react[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 16%,var(--surface));border-color:var(--accent);color:var(--accent)}
.react.pray[aria-pressed="true"]{background:color-mix(in srgb,var(--sage) 18%,var(--surface));border-color:var(--sage);color:var(--sage)}
.post .more{display:flex;gap:14px;margin-top:6px}
.post .more button{border:0;background:none;padding:4px 0;font-size:12px;color:var(--muted);text-decoration:underline;min-height:28px}
.cmts{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.cm{padding:5px 0;font-size:14px;overflow-wrap:anywhere}
.cmform{display:flex;gap:8px;margin-top:8px}
.cmform input{flex:1}
.verif{display:inline-block;font-size:11px;font-weight:700;color:var(--sage);border:1px solid var(--sage);border-radius:99px;padding:0 7px;margin-left:6px;vertical-align:2px}
.statrow{display:flex;gap:24px;margin:12px 0}
.statrow div{font-size:13px;color:var(--muted)}
.statrow b{display:block;font-size:22px;color:var(--ink);font-family:var(--serif);font-weight:500}
.pinned{background:var(--arch);color:var(--arch-ink);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.pinned .small{opacity:.8}
.pinned .pv{font-family:var(--serif);font-size:18px;line-height:1.35;margin:4px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" aria-label="Navigation principale"><div class="in" id="tabs"></div></nav>
<div id="overlay"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
/* ---------- Données ---------- */
const VERSES = [
  {t:"Car Dieu a tant aimé le monde qu'il a donné son Fils unique, afin que quiconque croit en lui ne périsse point, mais qu'il ait la vie éternelle.", r:"Jean 3:16"},
  {t:"L'Éternel est mon berger : je ne manquerai de rien.", r:"Psaume 23:1"},
  {t:"Je puis tout par celui qui me fortifie.", r:"Philippiens 4:13"},
  {t:"Venez à moi, vous tous qui êtes fatigués et chargés, et je vous donnerai du repos.", r:"Matthieu 11:28"},
  {t:"Ne t'effraie point et ne t'épouvante point, car l'Éternel, ton Dieu, est avec toi dans tous tes déplacements.", r:"Josué 1:9"},
  {t:"Confie-toi en l'Éternel de tout ton cœur, et ne t'appuie pas sur ta sagesse.", r:"Proverbes 3:5"},
  {t:"Ne crains rien, car je suis avec toi ; ne promène pas des regards inquiets, car je suis ton Dieu.", r:"Ésaïe 41:10"},
  {t:"Maintenant donc ces trois choses demeurent : la foi, l'espérance, la charité ; mais la plus grande de ces choses, c'est la charité.", r:"1 Corinthiens 13:13"},
  {t:"Dieu est pour nous un refuge et un appui, un secours qui ne manque jamais dans la détresse.", r:"Psaume 46:2"},
  {t:"Je vous laisse la paix, je vous donne ma paix. Que votre cœur ne se trouble point, et ne s'alarme point.", r:"Jean 14:27"},
  {t:"Ne vous inquiétez donc pas du lendemain ; car le lendemain aura soin de lui-même. À chaque jour suffit sa peine.", r:"Matthieu 6:34"},
  {t:"Le secours me vient de l'Éternel, qui a fait les cieux et la terre.", r:"Psaume 121:2"}
];
const PLANS = [
  {id:'jean', name:'Évangile de Jean', sub:'21 jours', days:Array.from({length:21},(_,i)=>`Jean ${i+1}`)},
  {id:'psaumes', name:'Psaumes', sub:'30 jours', days:Array.from({length:30},(_,i)=>`Psaumes ${i*5+1} à ${i*5+5}`)},
  {id:'proverbes', name:'Proverbes', sub:'31 jours', days:Array.from({length:31},(_,i)=>`Proverbes ${i+1}`)}
];
const ROOMS = [
  {id:'general', name:'Général', desc:'Pour se présenter et échanger simplement.'},
  {id:'priere', name:'Demandes de prière', desc:'Confiez un sujet, d\'autres prieront avec vous.'},
  {id:'foi', name:'Questions sur la foi', desc:'Poser une question sincère, sans débat de confession.'}
];
const SEED = {
  general:[{id:'g1',u:'Marie',t:'Bonjour à tous, content de découvrir cet espace !'},{id:'g2',u:'Samuel',t:'Bienvenue. Le plan de lecture sur Jean est un bon début.'}],
  priere:[{id:'p1',u:'Élodie',t:'Merci de prier pour mon père qui entre à l\'hôpital demain.'},{id:'p2',u:'Marc',t:'Je pense à vous, Élodie. Courage.'}],
  foi:[{id:'f1',u:'Karim',t:'Par où commencer quand on n\'a jamais lu la Bible ?'},{id:'f2',u:'Anne',t:'Beaucoup commencent par l\'Évangile de Jean, c\'est court et lumineux.'}]
};
const PARTNERS = [
  {c:'Librairie', n:'Librairie La Source', d:'Bibles, livres et cartes de vœux. Emplacement d\'exemple.'},
  {c:'Café associatif', n:'Le Café du Parvis', d:'Un lieu d\'accueil et de rencontre. Emplacement d\'exemple.'},
  {c:'Artisan', n:'Atelier du Charpentier', d:'Menuiserie et petits objets en bois. Emplacement d\'exemple.'}
];
const TYPES = {demande:'Demande', merci:'Remerciement', intercession:'Pour quelqu\'un'};

/* ---------- État (localStorage protégé) ---------- */
const KEY='parvis-proto-v1';
let S = load();
function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw) return Object.assign(defaults(), JSON.parse(raw)); }catch(e){}
  return defaults();
}
function defaults(){ return {tab:'today', plan:'jean', done:{}, prayers:[], pseudo:'', charter:false, user:null, maraudes:[], joined:{}, mv:'list', prayRem:[], notif:{on:false,time:'08:00',last:''}, consent:false, ideas:[], voted:[], church:null, cv:'home', req:null, mine:null, q:'', conf:'', chat:{}, blocked:[], reported:[], room:'general', theme:'auto', fv:'discover', follows:[], posts:[], re:{}, cm:{}, groups:{}, mg:[], gv:null, pv:null, op:null, sty:'temoignage', sdraft:'', bio:'', city:'', vis:'followers', premium:false, pin:null, accent:'', ctheme:'classique', tipper:false, tipShow:true}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- Utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600);}
function dayOfYear(d=new Date()){return Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);}
function todayVerse(){return VERSES[dayOfYear()%VERSES.length];}
function fmtDate(d){return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});}
function applyTheme(){ if(S.theme==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',S.theme); applyAccent(); }

/* ---------- Navigation ---------- */
const TABS=[{id:'today',l:'Aujourd\'hui',i:'☀'},{id:'feed',l:'Fil',i:'🕊'},{id:'groups',l:'Groupes',i:'👥'},{id:'chat',l:'Salons',i:'💬'},{id:'me',l:'Profil',i:'🙂'}];
function go(t){if(t==='maraude')S.mv='list'; if(t==='groups')S.gv=null;S.tab=t;save();render();window.scrollTo(0,0);}
function renderTabs(){
  $('#tabs').innerHTML=TABS.map(t=>`<button data-tab="${t.id}" ${S.tab===t.id?'aria-current="page"':''}><span class="i" aria-hidden="true">${t.i}</span>${t.l}</button>`).join('');
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));
}

/* ---------- Vues ---------- */
function viewToday(){
  const v=todayVerse();
  const p=PLANS.find(x=>x.id===S.plan); const done=(S.done[p.id]||[]); const nextIdx=p.days.findIndex((_,i)=>!done.includes(i));
  const pct=Math.round(done.length/p.days.length*100);
  return `
  <section class="arch" aria-labelledby="vt">
    <div class="date">${esc(fmtDate(new Date()))}</div>
    <blockquote id="vt">« ${esc(v.t)} »</blockquote>
    <cite>${esc(v.r)}</cite>
    <div class="src">Louis Segond 1910</div>
    <div class="row">
      <button class="btn ghost-light" id="share">Partager</button>
      <button class="btn ghost-light" id="vcard">Carte à partager</button>
    </div>
  </section>
  <div class="card"><h3>Le fil de la communauté</h3><p class="small muted">Témoignages, demandes de prière et questions des membres.</p><button class="btn primary small" data-go="feed">Ouvrir le fil</button></div>
  ${notifCard()}
  <div class="card">
    <h3>Votre lecture</h3>
    <p class="muted small" style="margin-bottom:4px">${esc(p.name)}, ${esc(p.sub)}</p>
    <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <p class="small">${nextIdx===-1?'Plan terminé. Bravo !':`Prochaine étape : <b>${esc(p.days[nextIdx])}</b>`}</p>
    <button class="btn primary small" data-go="read">${done.length?'Continuer':'Commencer'}</button>
  </div>
  <div class="card">
    <h3>Carnet de prière</h3>
    <p class="small muted">${S.prayers.length?`${S.prayers.filter(x=>!x.ok).length} en cours, ${S.prayers.filter(x=>x.ok).length} exaucée(s).`:'Rien d\'écrit pour l\'instant. Notez une première intention, elle reste privée.'}</p>
    <button class="btn small" data-go="prayer">Ouvrir le carnet</button>
  </div>
  ${todayChurch()}
  ${todayMaraude()}

function doSignIn(){

  $('#overlay').innerHTML=`<div class="modal-back" id="mb"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="ct">
    <h3 id="ct">Avant de vous connecter</h3>
    <p class="small">Une appartenance ou une pratique religieuse est une donnée sensible. Nous utilisons seulement votre e-mail Google et votre pseudo, pour permettre la modération des salons. Nous ne les vendons pas et n'affichons aucune publicité ciblée.</p>

    <div class="row"><button class="btn primary" id="cok" disabled>Continuer</button><button class="btn" id="cpol">Lire la politique</button><button class="btn" id="cno">Annuler</button></div></div></div>`;

}

const TIMEINPUT='border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;min-height:44px';
function bgPush(){return !!(window.parvisPush&&window.parvisPush.supported);}

function prayRemHtml(){
  const l=S.prayRem||[];
  return `<h2 style="font-size:20px;margin-top:20px">Rappels de prière</h2>
  <p class="muted small">Un rappel quotidien pour prendre un temps de prière. Jusqu'à ${S.premium?15:5} rappels${S.premium?'':' (15 avec Premium)'}.</p>
  ${!S.premium&&l.length>=5?'<p><button class="btn small" data-prem="Jusqu’à 15 rappels de prière">Débloquer avec Premium</button></p>':''}
  ${l.map(r=>`<div class="card flat" style="display:flex;align-items:center;justify-content:space-between;gap:8px"><div><h3 style="margin:0">${esc(r.label)}</h3><p class="small muted" style="margin:0">Tous les jours à ${esc(r.time)}</p></div><div class="row" style="flex-wrap:nowrap"><button class="btn small" data-rmtoggle="${esc(r.id)}">${r.on?'Actif':'En pause'}</button><button class="btn small danger" data-rmdel="${esc(r.id)}" aria-label="Supprimer le rappel ${esc(r.label)}">✕</button></div></div>`).join('')}
  ${l.length<(S.premium?15:5)?`<form class="card" id="rmform" autocomplete="off"><div class="field"><label for="rml">Nom du rappel</label><input type="text" id="rml" maxlength="40" placeholder="Prière du soir"></div><div class="field"><label for="rmt">Heure</label><input type="time" id="rmt" value="21:00" required style="${TIMEINPUT}"></div><button class="btn small primary" type="submit">Ajouter le rappel</button></form>`:''}`;

function notify(title,body){ try{ new Notification(title,{body}); return true; }catch(e){ return false; } }
function sendVerse(){ const v=todayVerse(); return notify('Verset du jour',`« ${v.t} » — ${v.r}`); }
async function ensurePerm(){
  if(!('Notification' in window)){ toast('Notifications indisponibles sur cet appareil'); return false; }
  let p=Notification.permission;
  try{ if(p!=='granted') p=await Notification.requestPermission(); }catch(e){ p='denied'; }
  if(p!=='granted'){ toast('Autorisation refusée. Activez-la dans les réglages du navigateur.'); return false; }
  return true;
}
function buildReminders(){
  const out=[]; const n=S.notif;
  if(n&&n.on) out.push({id:'verse',kind:'verse',label:'',time:n.time});
  (S.prayRem||[]).filter(r=>r.on).forEach(r=>out.push({id:r.id,kind:'prayer',label:r.label,time:r.time}));
  return out;
}
function syncReminders(){ if(window.parvisPush&&window.parvisPush.sync) window.parvisPush.sync(buildReminders()); }
function checkNotif(){
  if(window.parvisPush&&window.parvisPush.active) return;
  if(!('Notification' in window)||Notification.permission!=='granted') return;
  const now=new Date(), hm=now.toTimeString().slice(0,5), day=now.toDateString(), n=S.notif;
  if(n&&n.on&&hm>=n.time&&n.last!==day&&sendVerse()){ n.last=day; save(); }
  (S.prayRem||[]).forEach(r=>{ const late=mins(hm)-mins(r.time); if(r.on&&r.last!==day&&late>=0&&late<=120&&notify('Moment de prière',r.label)){ r.last=day; save(); } });
}
async function toggleNotif(){
  const n=S.notif;
  if(n.on){ n.on=false; save(); render(); syncReminders(); toast('Rappel désactivé'); return; }
  if(!(await ensurePerm())) return;
  n.on=true; n.last=''; save(); render(); syncReminders(); sendVerse(); toast('Rappel activé. Un essai vient d\'être envoyé.');
}
function bindNotif(){
  const t=$('#ntoggle'); if(t) t.onclick=toggleNotif;
  const i=$('#ntime'); if(i) i.onchange=()=>{ S.notif.time=i.value||'08:00'; S.notif.last=''; save(); render(); syncReminders(); };
  const f=$('#rmform');
  if(f) f.onsubmit=async e=>{
    e.preventDefault(); if(!(await ensurePerm())) return;
    S.prayRem.push({id:'r'+Date.now(),label:$('#rml').value.trim()||'Moment de prière',time:$('#rmt').value||'21:00',on:true,last:''});
    save(); render(); syncReminders(); toast('Rappel ajouté');
  };
  document.querySelectorAll('[data-rmtoggle]').forEach(b=>b.onclick=()=>{const r=S.prayRem.find(x=>x.id===b.dataset.rmtoggle);r.on=!r.on;save();render();syncReminders();});
  document.querySelectorAll('[data-rmdel]').forEach(b=>b.onclick=()=>{S.prayRem=S.prayRem.filter(x=>x.id!==b.dataset.rmdel);save();render();syncReminders();});
}

function bindMaraude(){
  const on=(id,fn)=>{const e=$(id); if(e) e.onclick=fn;};
  on('#newMar',()=>{S.mv='form';save();render();window.scrollTo(0,0);});
  on('#mback',()=>{S.mv='list';save();render();window.scrollTo(0,0);});
  on('#gsign4',doSignIn);
  document.querySelectorAll('[data-join]').forEach(b=>b.onclick=()=>{ if(!S.user){doSignIn();return;} S.joined[b.dataset.join]=[]; save(); render(); toast('Inscription enregistrée'); });
  document.querySelectorAll('[data-leave]').forEach(b=>b.onclick=()=>{ delete S.joined[b.dataset.leave]; save(); render(); toast('Désinscription enregistrée'); });
  document.querySelectorAll('[data-bring]').forEach(b=>b.onclick=()=>{ const a=S.joined[b.dataset.bring]||[], x=b.dataset.item; S.joined[b.dataset.bring]=a.includes(x)?a.filter(y=>y!==x):[...a,x]; save(); render(); });
  document.querySelectorAll('[data-mok]').forEach(b=>b.onclick=()=>{ const m=S.maraudes.find(x=>x.id===b.dataset.mok); m.status='ok'; save(); render(); toast('Validée (simulation)'); });
  document.querySelectorAll('[data-mdel]').forEach(b=>b.onclick=()=>{ if(confirm('Supprimer cette proposition ?')){ S.maraudes=S.maraudes.filter(x=>x.id!==b.dataset.mdel); save(); render(); } });
  const f=$('#mform');
  if(f) f.onsubmit=e=>{
    e.preventDefault();
    const d=$('#md').value,h=$('#mh').value;
    if(new Date(d+'T'+h)<=new Date()){ toast('Choisissez une date à venir'); return; }
    const need=Math.min(50,Math.max(2,parseInt($('#mn').value,10)||6));
    const c=myChurch();
    S.maraudes.unshift({id:'um'+Date.now(),t:$('#mt').value.trim(),o:c?c.n:(S.pseudo||'Un membre'),d,h,p:$('#mp').value.trim(),c:$('#mc').value.trim(),need,got:1,
      needs:[...document.querySelectorAll('[name=mneed]:checked')].map(x=>x.value),n:$('#mx').value.trim(),mine:true,status:'pending'});
    S.mv='list'; save(); render(); window.scrollTo(0,0); toast('Proposition envoyée pour validation');
  };
}

function ago(ts){
  const m=Math.max(0,Math.round((Date.now()-ts)/60000));

  const h=Math.round(m/60); if(h<24) return `il y a ${h} h`;

}

function ntPlan(books,n){
  const flat=[]; books.forEach(([b,c])=>{for(let i=1;i<=c;i++)flat.push([b,i]);});
  const per=flat.length/n, days=[];
  for(let d=0;d<n;d++){
    const a=flat[Math.floor(d*per)], z=flat[Math.min(flat.length-1,Math.ceil((d+1)*per)-1)];
    days.push(a[0]===z[0]?(a[1]===z[1]?`${a[0]} ${a[1]}`:`${a[0]} ${a[1]} à ${z[1]}`):`${a[0]} ${a[1]} → ${z[0]} ${z[1]}`);
  }
  return days;
}
const NT_BOOKS=[["Matthieu",28],["Marc",16],["Luc",24],["Jean",21],["Actes",28],["Romains",16],["1 Corinthiens",16],["2 Corinthiens",13],["Galates",6],["Éphésiens",6],["Philippiens",4],["Colossiens",4],["1 Thessaloniciens",5],["2 Thessaloniciens",3],["1 Timothée",6],["2 Timothée",4],["Tite",3],["Philémon",1],["Hébreux",13],["Jacques",5],["1 Pierre",5],["2 Pierre",3],["1 Jean",5],["2 Jean",1],["3 Jean",1],["Jude",1],["Apocalypse",22]];
PLANS.push({id:"nt90",name:"Nouveau Testament",sub:"90 jours",prem:true,days:ntPlan(NT_BOOKS,90)});
PLANS.push({id:"evang30",name:"Les quatre Évangiles",sub:"30 jours",prem:true,days:ntPlan(NT_BOOKS.slice(0,4),30)});
function prayStats(){
  if(!S.premium) return `<div class="card flat"><h3 style="margin:0 0 4px">Statistiques du carnet</h3><p class="small muted" style="margin:0 0 8px">Voyez combien de prières ont été exaucées et ce que vous portez le plus.</p><button class="btn small" data-prem="Les statistiques du carnet de prière">🔒 Débloquer avec Premium</button></div>`;
  const n=S.prayers.length, ok=S.prayers.filter(x=>x.ok).length;
  const by=Object.entries(TYPES).map(([k,v])=>`${v} : ${S.prayers.filter(x=>x.type===k).length}`).join(" · ");
  return `<div class="card flat"><h3 style="margin:0 0 4px">Statistiques du carnet</h3>
    <div class="statrow"><div><b>${n}</b>entrées</div><div><b>${ok}</b>exaucées</div><div><b>${n?Math.round(ok/n*100):0} %</b>d'exaucées</div></div>
    <p class="small muted" style="margin:0">${n?esc(by):"Écrivez une première prière pour voir vos statistiques."}</p></div>`;
}
const CARD_THEMES={
  classique:{n:"Classique",a:"#2F4BA0",b:"#16213E",ink:"#F6F2E6",gold:"#F0C768",free:true},
  aurore:{n:"Aurore",a:"#F2A65A",b:"#B4476B",ink:"#FFF8EE",gold:"#FFE3A3"},
  foret:{n:"Forêt",a:"#3F6B58",b:"#16302A",ink:"#F2F7F1",gold:"#CDE8B0"},
  nuit:{n:"Nuit étoilée",a:"#1B1B3A",b:"#050510",ink:"#F4F1FF",gold:"#F0C768",stars:true},
  sable:{n:"Sable",a:"#F1E3C6",b:"#D6B98A",ink:"#3A2A12",gold:"#8A5A12"},
  bordeaux:{n:"Bordeaux",a:"#8E2F4A",b:"#3E1220",ink:"#FBEFF2",gold:"#F3C58A"}
};
function wrapText(c,text,max){const w=text.split(" ");let l="";const out=[];w.forEach(x=>{const t=l?l+" "+x:x;if(c.measureText(t).width>max&&l){out.push(l);l=x;}else l=t;});if(l)out.push(l);return out;}
function drawCard(cv,key){
  const T=CARD_THEMES[key]||CARD_THEMES.classique, v=todayVerse(); cv.width=1080; cv.height=1350; const c=cv.getContext("2d");
  const g=c.createLinearGradient(0,0,0,1350); g.addColorStop(0,T.a); g.addColorStop(1,T.b); c.fillStyle=g; c.fillRect(0,0,1080,1350);
  if(T.stars){c.fillStyle="rgba(255,255,255,.7)"; for(let i=0;i<60;i++){const x=(i*173)%1080,y=(i*389)%1350,z=2+(i%3); c.fillRect(x,y,z,z);}}
  c.fillStyle=T.gold; c.fillRect(90,170,120,6); c.textBaseline="top";
  let s=64, lines=[]; for(;s>=34;s-=2){ c.font=`italic ${s}px Georgia, "Times New Roman", serif`; lines=wrapText(c,`« ${v.t} »`,900); if(lines.length*s*1.35<=760) break; }
  c.fillStyle=T.ink; lines.forEach((l,i)=>c.fillText(l,90,240+i*s*1.35));
  const y=240+lines.length*s*1.35+40; c.fillStyle=T.gold; c.font="600 40px system-ui, sans-serif"; c.fillText(v.r+" · Louis Segond 1910",90,y);
  c.fillStyle=T.ink; c.globalAlpha=.8; c.font="600 34px system-ui, sans-serif"; c.fillText("Le Parvis",90,1230); c.globalAlpha=1;
}
function cardModal(key){
  key=key||S.ctheme||"classique"; if(!S.premium&&!CARD_THEMES[key].free) key="classique"; S.ctheme=key;
  modal(`<h3>Carte de verset</h3>
    <div class="chips" style="margin:0 -20px;padding-left:20px;padding-right:20px">${Object.entries(CARD_THEMES).map(([k,t])=>`<button class="chip" aria-pressed="${k===key}" data-ct="${k}">${t.free||S.premium?"":"🔒 "}${esc(t.n)}</button>`).join("")}</div>
    <canvas id="vcv" style="width:100%;border-radius:12px;margin:8px 0" aria-label="Aperçu de la carte de verset"></canvas>
    <button class="btn primary" id="vsave" style="width:100%;margin-bottom:10px">Partager l'image</button>`);
  drawCard($("#vcv"),key);
  document.querySelectorAll("[data-ct]").forEach(b=>b.onclick=()=>{ const k=b.dataset.ct; if(!S.premium&&!CARD_THEMES[k].free){premModal("Les thèmes de cartes de verset");return;} cardModal(k); });
  $("#vsave").onclick=()=>{ $("#vcv").toBlob(async blob=>{
    if(!blob){toast("Image impossible sur cet appareil");return;}
    const f=new File([blob],"verset-du-jour.png",{type:"image/png"});
    try{ if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return;} }catch(e){return;}
    try{ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="verset-du-jour.png"; document.body.appendChild(a); a.click(); a.remove(); toast("Image enregistrée"); }catch(e){ toast("Partage d'image indisponible ici"); }
  }); };
}
function bindSocial(){
  const on=(id,fn)=>{const e=$(id); if(e) e.onclick=fn;};
  const all=(s,fn)=>document.querySelectorAll(s).forEach(fn);
  on("#gsign3",doSignIn);
  all("[data-fv]",b=>b.onclick=()=>{S.fv=b.dataset.fv;save();render();});
  all("[data-prof]",b=>b.onclick=()=>{S.pv=b.dataset.prof;S.tab="prof";save();render();window.scrollTo(0,0);});
  all("[data-follow]",b=>b.onclick=()=>{ if(!needUser()) return; const n=b.dataset.follow; S.follows=S.follows.includes(n)?S.follows.filter(x=>x!==n):[...S.follows,n]; save(); render(); });
  const react=(id,k)=>{ if(!needUser()) return; S.re[id]=S.re[id]||{}; S.re[id][k]=!S.re[id][k]; save(); render(); };
  all("[data-amen]",b=>b.onclick=()=>react(b.dataset.amen,"a"));
  all("[data-pray]",b=>b.onclick=()=>react(b.dataset.pray,"p"));
  all("[data-cm]",b=>b.onclick=()=>{S.op=S.op===b.dataset.cm?null:b.dataset.cm;render();});
  all(".cmform",f=>f.onsubmit=e=>{
    e.preventDefault(); const inp=f.querySelector("input"); const t=inp.value.trim(); if(!t) return;
    if(!needUser()) return; if(!S.pseudo){toast("Choisissez un pseudo dans votre profil");return;}
    ensureCharter(()=>{ (S.cm[f.dataset.id]=S.cm[f.dataset.id]||[]).push({u:S.pseudo,t}); save(); render(); });
  });
  all("[data-preport]",b=>b.onclick=()=>{ if(!S.reported.includes(b.dataset.preport)){S.reported.push(b.dataset.preport);save();render();} toast("Publication signalée. Un modérateur la vérifiera."); });
  all("[data-pblock]",b=>b.onclick=()=>{ if(confirm("Bloquer "+b.dataset.pblock+" ? Ses publications seront masquées.")){S.blocked.push(b.dataset.pblock);if(S.tab==="prof")S.tab="feed";save();render();} });
  all("[data-pdel]",b=>b.onclick=()=>{ if(confirm("Supprimer cette publication ?")){S.posts=S.posts.filter(p=>p.id!==b.dataset.pdel);save();render();} });
  const sty=$("#sty"); if(sty) sty.onchange=()=>{S.sdraft=$("#stxt").value;S.sty=sty.value;render();};
  const stx=$("#stxt"); if(stx) stx.oninput=()=>{S.sdraft=stx.value;};
  const sf=$("#sform");
  if(sf) sf.onsubmit=e=>{
    e.preventDefault(); const t=$("#stxt").value.trim(); if(!t){toast("Écrivez quelques mots d'abord");return;}
    if(!S.pseudo){toast("Choisissez un pseudo dans l'onglet Profil");return;}
    const anon=!!($("#sanon")&&$("#sanon").checked&&S.sty==="priere"); const g=sf.dataset.g||null; const ty=S.sty;
    let when=Date.now(), sched=false; const sch=S.premium&&$("#ssch")?$("#ssch").value:"";
    if(sch){ const ts=new Date(sch).getTime(); if(ts>Date.now()+60000&&ts<Date.now()+30*864e5){when=ts;sched=true;} else {toast("Choisissez une date dans les 30 prochains jours");return;} }
    ensureCharter(()=>{
      const lim=S.premium?10:3; if(S.posts.filter(p=>!p.sched&&Date.now()-p.d<3600000).length>=lim){toast(S.premium?"Limite atteinte : 10 publications par heure":"Limite atteinte : 3 publications par heure (10 avec Premium)");return;}
      const img=S.premium?DRAFT_IMG:""; S.posts.push({id:"u"+Date.now(),ty,t,d:when,g,anon,img,sched}); S.sdraft=""; DRAFT_IMG=""; save(); render(); toast("Publié");
    });
  };
  // Premium et photos
  on("#premtog",()=>setPrem(!S.premium));
  on("#simgLock",()=>premModal("Les photos dans les publications"));
  all("[data-prem]",b=>b.onclick=()=>premModal(b.dataset.prem));
  all("[data-acc]",b=>b.onclick=()=>{ if(!S.premium&&b.dataset.acc){premModal("Les couleurs de l'application");return;} S.accent=b.dataset.acc; save(); applyAccent(); render(); });
  all("[data-pin]",b=>b.onclick=()=>{ if(!S.premium){premModal("Épingler une publication sur son profil");return;} S.pin=S.pin===b.dataset.pin?null:b.dataset.pin; save(); render(); });
  on("#vcard",()=>cardModal());
  all("[data-tip]",b=>b.onclick=()=>tipModal());
  const tsh=$("#tipshow"); if(tsh) tsh.onchange=()=>{S.tipShow=tsh.checked;save();render();};
  const si=$("#simg");
  if(si) si.onchange=()=>{
    const f=si.files&&si.files[0]; if(!f) return;
    if(!/^image\//.test(f.type)){toast("Ce fichier n'est pas une image");return;}
    const r=new FileReader();
    r.onload=()=>{ const im=new Image(); im.onload=()=>{
      const k=Math.min(1,800/Math.max(im.width,im.height)); const c=document.createElement("canvas");
      c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      DRAFT_IMG=c.toDataURL("image/jpeg",0.7); S.sdraft=($("#stxt")||{}).value||S.sdraft; render();
    }; im.onerror=()=>toast("Image illisible"); im.src=r.result; };
    r.readAsDataURL(f);
  };
  // Groupes
  all("[data-gopen]",b=>b.onclick=()=>{S.gv=b.dataset.gopen;save();render();window.scrollTo(0,0);});
  on("#gback",()=>{S.gv=null;save();render();});
  all("[data-gjoin]",b=>b.onclick=()=>{
    if(!needUser()) return; const id=b.dataset.gjoin; const g=groupOf(id); const st=inGroup(id)?"in":(S.groups[id]||"");
    if(st==="in"||st==="pending"){ delete S.groups[id]; toast(st==="in"?"Vous avez quitté le groupe":"Demande annulée"); }
    else if(g.priv){ S.groups[id]="pending"; toast("Demande envoyée au modérateur du groupe"); }
    else { S.groups[id]="in"; toast("Bienvenue dans le groupe"); }
    save(); render();
  });
  const gf=$("#gform");
  if(gf) gf.onsubmit=e=>{
    e.preventDefault(); if(!needUser()) return;
    if(S.mg.length>=(S.premium?10:1)){ premModal(S.premium?"La limite de 10 groupes est atteinte":"Créer plus d'un groupe"); return; }
    const n=$("#gname").value.trim(), d=$("#gdesc").value.trim(); if(n.length<3){toast("Donnez un nom au groupe");return;}
    ensureCharter(()=>{ S.mg.push({id:"mg"+Date.now(),n,d:d||"Nouveau groupe.",m:1,priv:$("#gpriv").value==="1",mine:true}); save(); render(); toast("Groupe créé"); });
  };
  // Profil
  const pc=$("#pcity"); if(pc) pc.onchange=()=>{S.city=pc.value.trim();save();toast("Ville enregistrée");};
  const pb=$("#pbio"); if(pb) pb.onchange=()=>{S.bio=pb.value.trim();save();toast("Présentation enregistrée");};
  const pv=$("#pvis"); if(pv){ pv.value=S.vis; pv.onchange=()=>{S.vis=pv.value;save();toast("Visibilité enregistrée");}; }
}

/* ---------- Rendu + événements ---------- */
function render(){
  renderTabs();
  const v={today:viewToday,read:viewRead,prayer:viewPrayer,church:viewChurch,chat:viewChat,more:viewMore,ideas:viewIdeas,privacy:viewPrivacy,maraude:viewMaraude,feed:viewFeed,groups:viewGroups,me:viewMe,prof:viewProfile}[S.tab]();
  $('#app').innerHTML=`<header class="top"><h1 class="brand">Parvis<small>Lire, prier, partager</small></h1><button class="icon-btn" id="gear" aria-label="Réglages et compte">⚙</button></header>`+v;
  bind();bindChurch();bindIdeas();bindNotif();bindMaraude();bindSocial();
  const g=$('#gear'); if(g) g.onclick=()=>go('more');
}
function modal(html){
  $('#overlay').innerHTML=`<div class="modal-back" id="mb"><div class="modal" role="dialog" aria-modal="true">${html}<button class="btn primary" id="mclose">Fermer</button></div></div>`;
  $('#mclose').onclick=()=>$('#overlay').innerHTML='';
  $('#mb').onclick=e=>{if(e.target.id==='mb')$('#overlay').innerHTML='';};
  $('#mclose').focus();
}
function bind(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  const on=(id,fn)=>{const e=$(id); if(e) e.onclick=fn;};

  // Aujourd'hui
  on('#share',async()=>{
    const v=todayVerse(); const txt=`« ${v.t} » — ${v.r} (Louis Segond 1910)`;
    try{ if(navigator.share){await navigator.share({text:txt});return;} }catch(e){return;}
    try{ await navigator.clipboard.writeText(txt); toast('Verset copié'); }catch(e){ toast('Copie impossible sur cet appareil'); }
  });

  // Lecture
  document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{ const pl=PLANS.find(x=>x.id===b.dataset.plan); if(pl&&pl.prem&&!S.premium){premModal('Le plan « '+pl.name+' » ('+pl.sub+')');return;} S.plan=b.dataset.plan;save();render();});
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{

  };
  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{const p=S.prayers.find(x=>x.id===b.dataset.ok);p.ok=!p.ok;save();render();});

  on('#export',()=>{

  on('#becomePartner',()=>modal(`<h3>Devenir partenaire</h3><p>Les entreprises chrétiennes peuvent figurer dans ce bandeau en soutenant le projet. Chaque partenaire est clairement identifié comme tel, et les emplacements sont limités. Les modalités et le contact seront ajoutés ici.</p>`));

  document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>{ if(!S.reported.includes(b.dataset.report)){S.reported.push(b.dataset.report);save();render();} toast('Message signalé. Un modérateur le vérifiera.'); });
  document.querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>{ if(confirm('Bloquer '+b.dataset.block+' ? Ses messages seront masqués.')){S.blocked.push(b.dataset.block);save();render();} });
  const cf=$('#cform');
  if(cf) cf.onsubmit=e=>{
    e.preventDefault(); const t=$('#ctext').value.trim(); if(!t) return;
    (S.chat[S.room]=S.chat[S.room]||[]).push({id:'m'+Date.now(),u:S.pseudo||'Moi',t,me:true}); save(); render();
    const inp=$('#ctext'); if(inp) inp.focus();

  on('#wipe',()=>{ if(confirm('Effacer carnet, progression et messages de cet appareil ?')){ try{localStorage.removeItem(KEY);}catch(e){} if(window.parvisPush&&window.parvisPush.deleteAll) window.parvisPush.deleteAll(); S=defaults(); applyTheme(); render(); toast('Données effacées'); } });
}

applyTheme();
try{ const q=new URLSearchParams(location.search).get('tab'); if(['today','feed','groups','chat','me','read','prayer','church'].includes(q)) S.tab=q; }catch(e){}
render();
setInterval(checkNotif,30000);
syncReminders();
